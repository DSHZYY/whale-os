<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b142c">
<title>鲸鱼OS 2.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
#desk{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;
  background:radial-gradient(1200px 600px at 70% 8%,#1b4a7a66,transparent 60%),
             radial-gradient(900px 500px at 15% 92%,#0a5f7a55,transparent 60%),
             linear-gradient(180deg,#0b142c,#123152 58%,#0a1b33)}
#desk.w1{background:linear-gradient(180deg,#141026,#2b1b4d 60%,#0d0b1a)}
#desk.w2{background:linear-gradient(160deg,#07211f,#0b3b36 60%,#04120f)}
#desk.w3{background:linear-gradient(180deg,#2a1030,#4a1a3d 60%,#1a0a18)}

/* ── 桌面图标 ── */
.icon{position:absolute;width:64px;text-align:center;font-size:11px;color:#e9f2ff;cursor:pointer}
.icon .g{width:48px;height:48px;margin:0 auto 4px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:linear-gradient(160deg,#ffffff33,#ffffff14);border:1px solid #ffffff33}

/* ── 灵动岛 ── */
#island{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:900;
  background:#070a12f2;border:1px solid #ffffff26;border-radius:22px;
  height:38px;min-width:132px;display:flex;align-items:center;justify-content:center;
  padding:0 14px;font-size:13px;color:#dfe9f7;box-shadow:0 8px 26px #000a;
  transition:width .22s ease,height .22s ease,border-radius .22s ease}
#island .t{font-weight:600;letter-spacing:.5px}
#island .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;margin-left:8px}
#island.live{background:#0d1a2b}
#menu{position:absolute;top:54px;left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;pointer-events:none;
  z-index:899;width:270px;max-height:70%;overflow:auto;padding:10px;border-radius:18px;
  background:#0c1526f7;border:1px solid #ffffff24;box-shadow:0 22px 60px #000c;transition:.18s}
#menu.open{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#menu h4{margin:8px 8px 4px;font-size:11px;color:#7f96b3;font-weight:600;letter-spacing:1px}
.mi{display:flex;align-items:center;padding:9px 10px;border-radius:10px;font-size:13.5px;color:#e8f1ff}
.mi:active{background:#ffffff1f}
.mi i{font-style:normal;margin-right:9px;font-size:16px;width:20px;text-align:center}

/* ── 窗口 ── */
#wins{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;
  border-radius:13px;overflow:hidden;background:#0e1729f7;border:1px solid #ffffff26;
  box-shadow:0 20px 60px #000b;backdrop-filter:blur(12px)}
.win .tb{height:36px;display:flex;align-items:center;padding:0 6px 0 12px;background:#ffffff10;
  font-size:12.5px;color:#dbe7f5}
.win .tb b{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win .tb .btn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#cfe0f2;margin-left:2px}
.win .tb .btn:active{background:#ffffff24}
.win .tb .x:active{background:#e81123}
.win .bd{flex:1;overflow:auto;padding:12px;font-size:13px;line-height:1.7;color:#d7e4f3}
.win textarea{width:100%;height:100%;min-height:120px;background:transparent;border:0;color:#fff;font:inherit;
  resize:none;outline:none;-webkit-user-select:text;user-select:text}
.win.max{border-radius:0}
.btnrow{display:flex;flex-wrap:wrap;margin-top:8px}
.btnrow button{margin:4px 6px 4px 0;padding:8px 14px;border-radius:10px;border:1px solid #ffffff2e;
  background:#ffffff14;color:#e8f1ff;font-size:12.5px}
.btnrow button:active{background:#4aa3ff44}
.sw{width:44px;height:24px;border-radius:14px;background:#ffffff26;position:relative;transition:.2s}
.sw.on{background:#3b82f6}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{left:22px}

/* ── 多任务 ── */
#taskview{position:absolute;top:0;left:0;right:0;bottom:0;z-index:950;display:none;
  background:#05080ef2;padding:70px 14px 14px}
#taskview.show{display:block}
#taskview .card{display:flex;align-items:center;padding:12px;border-radius:14px;background:#ffffff12;
  border:1px solid #ffffff1f;margin-bottom:10px}
#taskview .card .ic{width:38px;height:38px;border-radius:11px;background:#ffffff1c;display:flex;
  align-items:center;justify-content:center;font-size:19px;margin-right:11px}
#taskview .card .nm{flex:1;font-size:13.5px}
#taskview .card .op{padding:7px 12px;border-radius:9px;background:#ffffff1f;font-size:12px;margin-left:6px}
#taskview .empty{text-align:center;color:#7891ab;font-size:13px;padding-top:60px}

#toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(20px);opacity:0;
  z-index:960;background:#0b1220f2;border:1px solid #ffffff26;border-radius:14px;padding:10px 16px;
  font-size:12.5px;color:#dfe9f7;transition:.25s;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#dock{position:absolute;left:0;right:0;bottom:0;height:0}
/* 从灵动岛掉下来的消息 */
#msg{position:absolute;left:50%;top:8px;transform:translateX(-50%) translateY(-130%);
  z-index:940;width:min(84%,340px);padding:12px 14px;border-radius:20px;
  background:#0d1a2bf7;border:1px solid #ffffff2b;box-shadow:0 18px 50px #000c;
  transition:transform .32s cubic-bezier(.2,.9,.25,1),opacity .3s;opacity:0;pointer-events:none}
#msg.show{transform:translateX(-50%) translateY(0);opacity:1}
#msg .h{display:flex;align-items:center;font-size:11.5px;color:#8fb4d6;margin-bottom:4px}
#msg .h b{color:#dfe9f7;font-size:12.5px;margin-left:6px;font-weight:600}
#msg .b{font-size:13px;line-height:1.55;color:#e6eef8}
</style>
</head>
<body>
<div id="desk">
  <div class="icon" style="left:14px;top:70px" onclick="open('note')"><div class="g">📝</div>记事本</div>
  <div class="icon" style="left:14px;top:150px" onclick="open('trash')"><div class="g">🗑️</div>回收站</div>
  <div class="icon" style="left:14px;top:230px" onclick="open('settings')"><div class="g">⚙️</div>设置</div>
  <div class="icon" style="left:14px;top:310px" onclick="open('about')"><div class="g">ℹ️</div>关于</div>
  <div class="icon" style="left:14px;top:390px" onclick="open('apps')"><div class="g">🗂️</div>应用</div>
</div>
<div id="wins"></div>

<div id="island" onclick="islandTap()">
  <span class="t" id="itime">--:--</span><span class="dot" id="idot"></span>
</div>

<div id="menu">
  <h4>开始</h4>
  <div class="mi" onclick="open('apps')"><i>🗂️</i>应用（同步）</div>
  <div class="mi" onclick="open('note')"><i>📝</i>记事本</div>
  <div class="mi" onclick="open('settings')"><i>⚙️</i>设置</div>
  <div class="mi" onclick="open('about')"><i>ℹ️</i>关于鲸鱼OS</div>
  <h4>系统</h4>
  <div class="mi" onclick="taskview()"><i>🪟</i>多任务</div>
  <div class="mi" onclick="appSync()"><i>🔄</i>同步应用</div>
  <div class="mi" onclick="rotateTest()"><i>📱</i>横屏 / 竖屏</div>
  <div class="mi" onclick="toast('这是 AI 做的假系统，不是真的 Windows')"><i>💬</i>试一下通知</div>
</div>

<div id="msg"><div class="h"><span>🐋</span><b>鲸鱼OS</b></div><div class="b" id="msgb"></div></div>
<div id="taskview"><div id="tvlist"></div></div>
<div id="toast"></div>

<script>
var $=function(s){return document.querySelector(s)};
var innerW=function(){return window.innerWidth||document.documentElement.clientWidth};
var innerH=function(){return window.innerHeight||document.documentElement.clientHeight};

function fit(){
  var h=innerH(), w=innerW();
  document.documentElement.style.height=h+'px';
  document.body.style.height=h+'px';
  document.getElementById('desk').style.width=w+'px';
  document.getElementById('wins').style.width=w+'px';
  document.getElementById('wins').style.height=h+'px';
}
fit(); window.addEventListener('resize',function(){fit();reflow();});
window.addEventListener('orientationchange',function(){setTimeout(function(){fit();reflow();},260)});

var S={wall:0,island:true,dark:true};
try{var raw=localStorage.getItem('whaleos2');if(raw)S=JSON.parse(raw)}catch(e){}
function saveS(){try{localStorage.setItem('whaleos2',JSON.stringify(S))}catch(e){}}
function applyS(){
  var d=document.getElementById('desk');
  d.className=S.wall?'w'+S.wall:'';
  document.getElementById('island').style.display=S.island?'flex':'none';
}

/* 闹钟 */
function tick(){
  var d=new Date(),p=function(n){return String(n).padStart(2,'0')};
  var t=p(d.getHours())+':'+p(d.getMinutes());
  document.getElementById('itime').textContent=t;
}
setInterval(tick,1000);tick();

/* Toast */
var msgT=null;
function toast(msg){ notify('鲸鱼OS', msg); }
function notify(title, body, ms){
  var el=document.getElementById('msg');
  el.querySelector('.h b').textContent=title||'鲸鱼OS';
  document.getElementById('msgb').textContent=body||'';
  var isl=document.getElementById('island');
  el.classList.add('show');
  if(isl) isl.classList.add('live');
  clearTimeout(msgT);
  msgT=setTimeout(function(){
    el.classList.remove('show');
    var isl2=document.getElementById('island');
    if(isl2&&!menuOpen) isl2.classList.remove('live');
  }, ms||2600);
}

/* 开始菜单：挂在灵动岛下面 */
var menuOpen=false;
function islandTap(){
  var m=document.getElementById('menu');
  menuOpen=!menuOpen;
  if(menuOpen){m.classList.add('open');document.getElementById('island').classList.add('live')}
  else{m.classList.remove('open');document.getElementById('island').classList.remove('live')}
}
function closeMenu(){
  if(menuOpen){menuOpen=false;
    document.getElementById('menu').classList.remove('open');
    document.getElementById('island').classList.remove('live')}
}

/* 应用注册表 */
var APPS={
  note:{t:'记事本',ic:'📝',w:330,h:300,body:function(){return '<textarea placeholder="随便打点字…"></textarea>'}},
  trash:{t:'回收站',ic:'🗑️',w:300,h:200,body:function(){return '<div>🗑️ 这里空空如也<br><br><small style="opacity:.6">（演示用，不真的删除文件）</small></div>'}},
  about:{t:'关于鲸鱼OS',ic:'ℹ️',w:320,h:250,body:function(){return '<div><b>鲸鱼OS 2.0 · 安卓版</b><br><br>灵动岛 · 开始菜单 · 多任务 · 窗口最大化最小化 · 横屏<br><br>电脑版是 C++ 单文件（GitHub: whale-os）</div>'}},
  settings:{t:'设置',ic:'⚙️',w:330,h:360,body:function(){
    return '<div><b>外观</b></div>'+
      '<div class="btnrow"><button onclick="setWall()">换壁纸</button>'+
      '<button onclick="toggleIsland()">灵动岛：'+(S.island?'开':'关')+'</button></div>'+
      '<div style="margin-top:12px"><b>系统</b></div>'+
      '<div class="btnrow"><button onclick="appSync()">同步应用</button>'+
      '<button onclick="rotateTest()">横屏测试</button>'+
      '<button onclick="open(\'taskview\')">多任务</button></div>'+
      '<div style="margin-top:12px"><b>存储</b></div>'+
      '<div class="btnrow"><button onclick="resetAll()">清空本机数据</button></div>'+
      '<div style="margin-top:14px;opacity:.6;font-size:12px">鲸鱼OS 2.0 · 网页内核</div>';
  }},
  apps:{t:'应用（同步）',ic:'🗂️',w:320,h:330,body:function(){
    var list=[['📝','记事本','note'],['🗑️','回收站','trash'],['⚙️','设置','settings'],['ℹ️','关于','about'],
              ['🧮','计算器','calc'],['🖼️','壁纸','wall'],['🪟','多任务','taskview'],['📱','横屏','rotate']];
    var h='<div style="font-size:12px;opacity:.65;margin-bottom:10px">点「同步应用」可以和电脑版保持一致</div><div class="btnrow">';
    for(var i=0;i<list.length;i++){
      h+='<button onclick="launch(\''+list[i][2]+'\')">'+list[i][0]+' '+list[i][1]+'</button>';
    }
    return h+'</div>';
  }},
  calc:{t:'计算器',ic:'🧮',w:300,h:330,body:function(){
    return '<div id="calcDisp" style="font-size:26px;text-align:right;padding:8px 6px;border-bottom:1px solid #ffffff22;margin-bottom:8px">0</div>'+
      '<div class="btnrow">'+
      ['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+','C','←'].map(function(k){
        return '<button style="width:60px" onclick="calcKey(\''+k+'\')">'+k+'</button>'}).join('')+
      '</div>';
  }}
};

/* 窗口管理 */
var wins={}, zTop=10, seq=0;
function open(k){
  closeMenu();
  if(k==='taskview'){taskview();return}
  if(k==='rotate'){rotateTest();return}
  if(k==='wall'){setWall();return}
  var a=APPS[k]; if(!a)return;
  if(wins[k]){focusWin(k);return}
  var W=innerW(),H=innerH();
  var w=Math.min(a.w,W-24), h=Math.min(a.h,H-140);
  var el=document.createElement('div');
  el.className='win'; el.id='win_'+k;
  el.style.width=w+'px'; el.style.height=h+'px';
  el.style.left=Math.max(10,(W-w)/2)+'px';
  el.style.top=Math.max(64,(H-h)/2-20)+'px';
  el.style.zIndex=++zTop;
  el.innerHTML='<div class="tb"><b>'+a.ic+' '+a.t+'</b>'+
    '<div class="btn mn">–</div><div class="btn mx">□</div><div class="btn x">✕</div></div>'+
    '<div class="bd">'+a.body()+'</div>';
  document.getElementById('wins').appendChild(el);
  wins[k]={el:el,min:false,max:false,ox:0,oy:0};
  el.querySelector('.x').onclick=function(e){e.stopPropagation();closeWin(k)};
  el.querySelector('.mn').onclick=function(e){e.stopPropagation();minWin(k)};
  el.querySelector('.mx').onclick=function(e){e.stopPropagation();maxWin(k)};
  dragWin(k, el.querySelector('.tb'));
  el.addEventListener('mousedown',function(){focusWin(k)});
  el.addEventListener('touchstart',function(){focusWin(k)},{passive:true});
  return el;
}
function focusWin(k){
  var w=wins[k]; if(!w)return;
  if(w.min){w.min=false;w.el.style.display='flex'}
  w.el.style.zIndex=++zTop;
}
function closeWin(k){
  var w=wins[k]; if(!w)return;
  w.el.parentNode.removeChild(w.el); delete wins[k];
  toast('已关闭');
}
function minWin(k){
  var w=wins[k]; if(!w)return;
  w.min=true; w.el.style.display='none';
  toast('已最小化 · 点灵动岛→多任务可恢复');
}
function maxWin(k){
  var w=wins[k]; if(!w)return;
  var W=innerW(),H=innerH();
  if(!w.max){
    w.prev={l:w.el.style.left,t:w.el.style.top,w:w.el.style.width,h:w.el.style.height};
    w.el.style.left='0px'; w.el.style.top='44px';
    w.el.style.width=W+'px'; w.el.style.height=(H-44)+'px';
    w.el.classList.add('max'); w.max=true;
  } else {
    w.el.style.left=w.prev.l; w.el.style.top=w.prev.t;
    w.el.style.width=w.prev.w; w.el.style.height=w.prev.h;
    w.el.classList.remove('max'); w.max=false;
  }
  fit();
}
function dragWin(k,tb){
  var w=wins[k];
  var sx=0,sy=0,ol=0,ot=0,dragging=false;
  function down(e){
    if(w.max)return;
    dragging=true;
    var p=e.touches?e.touches[0]:e;
    sx=p.clientX; sy=p.clientY;
    ol=parseInt(w.el.style.left)||0; ot=parseInt(w.el.style.top)||0;
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up);
  }
  function move(e){
    if(!dragging)return;
    var p=e.touches?e.touches[0]:e; if(!p)return;
    var nx=Math.max(-40,Math.min(innerW()-60,ol+(p.clientX-sx)));
    var ny=Math.max(46,Math.min(innerH()-60,ot+(p.clientY-sy)));
    w.el.style.left=nx+'px'; w.el.style.top=ny+'px';
    if(e.cancelable&&e.touches)e.preventDefault();
  }
  function up(){
    dragging=false;
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up);
  }
  tb.addEventListener('mousedown',down);
  tb.addEventListener('touchstart',down,{passive:false});
}

/* 多任务 */
function taskview(){
  closeMenu();
  var tv=document.getElementById('taskview'), list=document.getElementById('tvlist');
  var keys=Object.keys(wins);
  var h='';
  if(!keys.length){
    h='<div class="empty">没有运行中的应用<br><br>点灵动岛 → 开始，打开一个</div>';
  } else {
    for(var i=0;i<keys.length;i++){
      var k=keys[i], a=APPS[k]||{ic:'🪟',t:k};
      h+='<div class="card"><div class="ic">'+a.ic+'</div><div class="nm">'+a.t+(wins[k].min?' <span style="opacity:.5">（最小化）</span>':'')+'</div>'+
         '<div class="op" onclick="tvOpen(\''+k+'\')">打开</div>'+
         '<div class="op" onclick="tvClose(\''+k+'\')">关闭</div></div>';
    }
  }
  h+='<div style="text-align:center;margin-top:18px"><button onclick="tvHide()" style="padding:10px 22px;border-radius:12px;border:1px solid #ffffff2e;background:#ffffff14;color:#e8f1ff">返回桌面</button></div>';
  list.innerHTML=h;
  tv.classList.add('show');
}
function tvHide(){document.getElementById('taskview').classList.remove('show')}
function tvOpen(k){tvHide();focusWin(k)}
function tvClose(k){closeWin(k);taskview()}

/* 设置动作 */
function setWall(){
  S.wall=(S.wall+1)%4; saveS(); applyS(); toast('壁纸已更换');
  var el=document.getElementById('win_settings');
  if(el){var b=el.querySelector('.bd'); if(b)b.innerHTML=APPS.settings.body()}
}
function toggleIsland(){
  S.island=!S.island; saveS(); applyS(); toast('灵动岛：'+(S.island?'开':'关'));
  var el=document.getElementById('win_settings');
  if(el){var b=el.querySelector('.bd'); if(b)b.innerHTML=APPS.settings.body()}
}
function resetAll(){
  try{localStorage.removeItem('whaleos2')}catch(e){}
  S={wall:0,island:true,dark:true}; applyS(); toast('已清空');
}
function appSync(){
  toast('正在同步应用列表…');
  setTimeout(function(){toast('同步完成：8 个应用已对齐电脑版')},900);
}
function rotateTest(){
  toast('把手机横过来试试 · 窗口会自动重排');
  setTimeout(function(){reflow()},300);
}
function reflow(){
  var W=innerW(),H=innerH();
  document.getElementById('island').style.top='8px';
  for(var k in wins){
    var w=wins[k];
    if(w.max){w.el.style.width=W+'px';w.el.style.height=(H-44)+'px';w.el.style.top='44px';w.el.style.left='0px'}
    else{
      var l=parseInt(w.el.style.left)||0, t=parseInt(w.el.style.top)||0;
      if(l>W-60)w.el.style.left=Math.max(8,W-120)+'px';
      if(t>H-60)w.el.style.top=Math.max(46,H-140)+'px';
    }
  }
}

/* 计算器 */
var calcBuf='0';
function calcKey(k){
  var d=document.getElementById('calcDisp'); if(!d)return;
  if(k==='C'){calcBuf='0'}
  else if(k==='←'){calcBuf=calcBuf.length>1?calcBuf.slice(0,-1):'0'}
  else if(k==='='){
    try{
      var expr=calcBuf.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      if(!/^[0-9+\-*/.() ]+$/.test(expr))throw 0;
      var r=Function('return ('+expr+')')();
      calcBuf=String(Math.round(r*1e10)/1e10);
    }catch(e){calcBuf='错误'}
  }
  else{calcBuf=(calcBuf==='0'||calcBuf==='错误')?k:calcBuf+k}
  d.textContent=calcBuf;
}
function launch(k){
  if(k==='taskview')return taskview();
  if(k==='rotate')return rotateTest();
  if(k==='wall')return setWall();
  open(k);
}

/* 硬件返回键：单次回退，连按两下回开始菜单 */
var lastBack=0;
window.onBackPressed=function(){
  var now=Date.now();
  var dbl=(now-lastBack)<700;
  lastBack=now;

  var tv=document.getElementById('taskview');
  if(tv.classList.contains('show')){ tvHide(); return true; }
  if(menuOpen){ closeMenu(); return true; }
  var mp=document.getElementById('msg');
  if(mp.classList.contains('show')){ mp.classList.remove('show'); return true; }

  if(dbl){                       // 连按两下 → 开始菜单
    if(!menuOpen) islandTap();
    toast('回到开始菜单');
    return true;
  }

  // 单次：收起最上面的窗口（最小化）
  var top=null,tz=-1;
  for(var k in wins){
    var w=wins[k];
    if(w.min)continue;
    var z=parseInt(w.el.style.zIndex)||0;
    if(z>tz){tz=z;top=k}
  }
  if(top){ minWin(top); return true; }
  toast('已经在桌面 · 再快速按一下回开始菜单');
  return true;   // 始终拦下，不退出 App
};
window.onKey=(function(prev){
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'||e.keyCode===27){ window.onBackPressed(); }
  });
})();

/* 手势：从左边缘往右滑 = 返回上一级；长按灵动岛 = 多任务 */
(function(){
  var sx=0,sy=0,t0=0,armed=false;
  document.addEventListener('touchstart',function(e){
    var p=e.touches[0]; if(!p)return;
    sx=p.clientX; sy=p.clientY; t0=Date.now();
    armed=(sx<28);   // 左边缘 28px 内起手
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!armed)return;
    var p=(e.changedTouches&&e.changedTouches[0]); if(!p)return;
    var dx=p.clientX-sx, dy=Math.abs(p.clientY-sy);
    if(dx>70 && dy<60){ window.onBackPressed(); }
    armed=false;
  },{passive:true});
  var lt=null;
  var isl=document.getElementById('island');
  if(isl){
    isl.addEventListener('touchstart',function(){ lt=setTimeout(function(){ taskview(); lt=null; },650) },{passive:true});
    isl.addEventListener('touchend',function(){ if(lt){clearTimeout(lt);lt=null;} },{passive:true});
    isl.addEventListener('touchmove',function(){ if(lt){clearTimeout(lt);lt=null;} },{passive:true});
  }
})();

/* 点空白关菜单 */
document.addEventListener('click',function(e){
  if(!e.target.closest('#menu')&&!e.target.closest('#island'))closeMenu();
});

applyS();
setTimeout(function(){toast('鲸鱼OS 2.0 已启动 · 点灵动岛打开开始菜单')},700);
</script>
