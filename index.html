<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b142c">
<title>鲸鱼OS 2.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
 font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
/* 壁纸 */
#desk{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;
 background:radial-gradient(1200px 600px at 70% 8%,#1b4a7a66,transparent 60%),
            radial-gradient(900px 500px at 15% 92%,#0a5f7a55,transparent 60%),
            linear-gradient(180deg,#0b142c,#123152 58%,#0a1b33)}
#desk.w1{background:linear-gradient(180deg,#141026,#2b1b4d 60%,#0d0b1a)}
#desk.w2{background:linear-gradient(160deg,#07211f,#0b3b36 60%,#04120f)}
#desk.w3{background:linear-gradient(180deg,#2a1030,#4a1a3d 60%,#1a0a18)}
#desk.w4{background:linear-gradient(160deg,#1b1206,#4a2a0a 55%,#120b04)}
#desk.w5{background:radial-gradient(700px 500px at 50% 30%,#ffffff22,transparent 60%),linear-gradient(180deg,#101418,#1c2430 60%,#0b0f14)}
/* 大时钟 */
#clock{position:absolute;left:0;right:0;top:64px;text-align:center;pointer-events:none;transition:opacity .25s}
#clock b{display:block;font-size:56px;font-weight:200;letter-spacing:2px;color:#eaf3ff;
 text-shadow:0 6px 30px #0008}
#clock span{display:block;margin-top:2px;font-size:12.5px;color:#9fb8d0;letter-spacing:1px}
#clock.off{opacity:0}
/* 图标 */
.icon{position:absolute;width:66px;text-align:center;font-size:11px;color:#e9f2ff;cursor:pointer;z-index:5}
.icon .g{width:48px;height:48px;margin:0 auto 4px;border-radius:13px;display:flex;align-items:center;
 justify-content:center;font-size:22px;background:linear-gradient(160deg,#ffffff33,#ffffff14);
 border:1px solid #ffffff33;overflow:hidden}
.icon .g img{width:34px;height:34px}
.icon:active .g{background:#ffffff3a}
/* 灵动岛 */
#island{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:900;
 background:#070a12f2;border:1px solid #ffffff26;border-radius:22px;display:flex;align-items:center;
 justify-content:center;overflow:hidden;padding:0 15px;font-size:13px;color:#dfe9f7;
 box-shadow:0 8px 26px #000a;transition:all .3s cubic-bezier(.25,.9,.3,1);max-width:88%}
#island .pill{display:flex;align-items:center;height:38px;white-space:nowrap}
#island .pill .t{font-weight:600;letter-spacing:.5px}
#island .pill .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;margin-left:8px}
#icard{display:none;width:100%;padding:10px 2px}
#island.big{width:88%;max-width:350px;border-radius:20px;background:#0d1a2bf7;padding:10px 14px}
#island.big .pill{display:none}
#island.big #icard{display:block}
#icard .ih{display:flex;align-items:center;font-size:11.5px;color:#87abcd;margin-bottom:3px}
#icard .ih b{color:#e3edf8;font-size:12px;margin-left:6px;font-weight:600}
#icard .ib{font-size:13px;line-height:1.5;color:#e8f0fa;word-break:break-word}
/* 开始菜单 */
#menu{position:absolute;top:54px;left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;
 pointer-events:none;z-index:899;width:280px;max-height:72%;overflow:auto;padding:10px;border-radius:18px;
 background:#0c1526f7;border:1px solid #ffffff24;box-shadow:0 22px 60px #000c;transition:.18s}
#menu.open{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#menu h4{margin:8px 8px 4px;font-size:11px;color:#7f96b3;font-weight:600;letter-spacing:1px}
.mi{display:flex;align-items:center;padding:9px 10px;border-radius:10px;font-size:13.5px;color:#e8f1ff}
.mi:active{background:#ffffff1f}
.mi i{font-style:normal;margin-right:9px;font-size:16px;width:20px;text-align:center}
/* 窗口 */
#wins{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;border-radius:13px;
 overflow:hidden;background:#0e1729;border:1px solid #ffffff26;box-shadow:0 20px 60px #000b}
.win .tb{height:36px;display:flex;align-items:center;padding:0 6px 0 12px;background:#ffffff10;
 font-size:12.5px;color:#dbe7f5}
.win .tb b{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win .tb .btn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;
 justify-content:center;font-size:13px;color:#cfe0f2;margin-left:2px}
.win .tb .btn:active{background:#ffffff24}
.win .tb .x:active{background:#e81123}
.win .bd{flex:1;overflow:auto;padding:12px;font-size:13px;line-height:1.7;color:#d7e4f3}
.win.max{border-radius:0}
.win textarea{width:100%;height:100%;min-height:130px;background:transparent;border:0;color:#fff;
 font:inherit;resize:none;outline:none;-webkit-user-select:text;user-select:text}
.btnrow{display:flex;flex-wrap:wrap;margin-top:6px}
.btnrow button{margin:4px 6px 4px 0;padding:8px 14px;border-radius:10px;border:1px solid #ffffff2e;
 background:#ffffff14;color:#e8f1ff;font-size:12.5px}
.btnrow button:active{background:#4aa3ff44}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid #ffffff12}
.row:last-child{border-bottom:0}
.row .k{font-size:13px}
.row .v{color:#8fb4d6;font-size:12.5px}
.sw{width:44px;height:24px;border-radius:14px;background:#ffffff26;position:relative;transition:.2s;flex:none}
.sw.on{background:#3b82f6}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{left:22px}
.wallgrid{display:flex;flex-wrap:wrap;margin-top:6px}
.wallsw{width:46px;height:34px;border-radius:9px;margin:0 8px 8px 0;border:2px solid transparent}
.wallsw.on{border-color:#4aa3ff}
/* 多任务 */
#tv{position:absolute;top:0;left:0;right:0;bottom:0;z-index:950;display:none;background:#05080ef7;padding:56px 12px 12px}
#tv.show{display:block}
#tv .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px}
#tv .hdr .t{font-size:14px;color:#cfe0f2;font-weight:600}
#tv .hdr .a{font-size:12px;color:#8fb4d6;padding:6px 12px;border-radius:9px;background:#ffffff14}
#tv .grid{display:flex;flex-wrap:wrap}
#tv .card{width:46%;margin:0 2% 12px 0;border-radius:16px;overflow:hidden;background:#111c2e;
 border:1px solid #ffffff1f;position:relative}
#tv .card .pv{height:82px;display:flex;align-items:center;justify-content:center;font-size:34px;
 background:linear-gradient(160deg,#1c2f47,#101a29)}
#tv .card .bar{display:flex;align-items:center;padding:8px 10px;font-size:11.5px;color:#cfe0f2}
#tv .card .bar .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tv .card .bar .x{width:22px;height:22px;border-radius:50%;background:#ffffff26;display:flex;
 align-items:center;justify-content:center;font-size:11px;margin-left:6px}
#tv .card .bar .x:active{background:#e81123}
#tv .card .tag{position:absolute;top:6px;left:8px;font-size:10px;padding:2px 6px;border-radius:6px;
 background:#000000aa;color:#8fd0ff}
#tv .empty{width:100%;text-align:center;color:#7891ab;font-size:13px;padding:70px 0}
/* 桌面右键菜单 */
#ctx{position:absolute;z-index:970;display:none;min-width:170px;padding:6px;border-radius:13px;
 background:#0c1526f8;border:1px solid #ffffff24;box-shadow:0 18px 50px #000c}
#ctx.show{display:block}
#ctx div{padding:9px 12px;border-radius:9px;font-size:13px;color:#e8f1ff}
#ctx div:active{background:#ffffff1f}
#dots{position:absolute;left:0;right:0;bottom:14px;text-align:center;z-index:800;pointer-events:none}
#dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffffff45;margin:0 4px}
#dots i.on{background:#ffffffd0;width:18px;border-radius:4px}
</style>
</head>
<body>
<div id="desk">
  <div id="clock"><b id="ct">--:--</b><span id="cd"></span></div>
  <div class="icon" style="left:14px;top:230px" onclick="openApp('note')"><div class="g">📝</div>记事本</div>
  <div class="icon" style="left:14px;top:314px" onclick="openApp('paint')"><div class="g">🎨</div>画图</div>
  <div class="icon" style="left:14px;top:398px" onclick="openApp('trash')"><div class="g">🗑️</div>回收站</div>
  <div class="icon" style="left:14px;top:482px" onclick="openApp('settings')"><div class="g">⚙️</div>设置</div>
  <div class="icon" style="left:14px;top:566px" onclick="openApp('apps')"><div class="g">🗂️</div>应用</div>
</div>
<div id="dots"></div>
<div id="wins"></div>

<div id="island" onclick="islandTap()">
  <div class="pill"><span class="t" id="itime">--:--</span><span class="dot"></span></div>
  <div id="icard"><div class="ih">🐋 <b id="ititle">鲸鱼OS</b></div><div class="ib" id="ibody"></div></div>
</div>

<div id="menu">
  <h4>常用</h4>
  <div class="mi" onclick="openApp('note')"><i>📝</i>记事本</div>
  <div class="mi" onclick="openApp('paint')"><i>🎨</i>画图</div>
  <div class="mi" onclick="openApp('apps')"><i>🗂️</i>所有应用</div>
  <div class="mi" onclick="openApp('settings')"><i>⚙️</i>设置</div>
  <div class="mi" onclick="openApp('about')"><i>ℹ️</i>关于鲸鱼OS</div>
  <h4>系统</h4>
  <div class="mi" onclick="taskview()"><i>🪟</i>多任务</div>
  <div class="mi" onclick="appSync()"><i>🔄</i>同步电脑桌面</div>
  <div class="mi" onclick="phoneDesk()"><i>📲</i>同步手机桌面</div>
  <div class="mi" onclick="notify('提示','这只是个假 Windows，不是真的系统')"><i>💬</i>试一下通知</div>
</div>

<div id="tv"><div id="tvlist"></div></div>
<div id="ctx"><div onclick="ctxNew()">新建文本文档</div><div onclick="ctxWall()">换个壁纸</div><div onclick="ctxClean()">整理桌面</div></div>

<script>
var $=function(s){return document.querySelector(s)};
window.onerror=function(m,src,l){try{notify('鲸鱼OS 出错',String(m)+' (第'+l+'行)',8000);}catch(e){} return true;};
function innerW(){return window.innerWidth||document.documentElement.clientWidth}
function innerH(){return window.innerHeight||document.documentElement.clientHeight}

/* ── 设置 ── */
var S={wall:0,clock:true,island:true,h24:true,accent:'#3b82f6'};
try{var _s=localStorage.getItem('whaleos2');if(_s)S=JSON.parse(_s);}catch(e){}
function saveS(){try{localStorage.setItem('whaleos2',JSON.stringify(S));}catch(e){}}

/* ── 桌面分页 ── */
var ICONS=[],PAGE=0;
function collectIcons(){
  ICONS=[];
  var els=document.querySelectorAll('#desk .icon');
  for(var i=0;i<els.length;i++){
    var e=els[i],m=(e.getAttribute('onclick')||'').match(/'([^']+)'/);
    ICONS.push({el:e,app:m?m[1]:'note',name:e.textContent.trim()});
  }
}
function grid(){var rows=Math.max(3,Math.floor((innerH()-190)/84)),cols=Math.max(2,Math.floor((innerW()-96)/78));
  return {rows:rows,cols:cols,per:rows*cols};}
function pageCount(){var g=grid();return Math.max(3,Math.ceil(ICONS.length/g.per));}
function layoutIcons(){
  var g=grid();
  for(var i=0;i<ICONS.length;i++){
    var it=ICONS[i],pg=Math.floor(i/g.per),idx=i%g.per;
    it.el.style.left=(14+Math.floor(idx/g.rows)*78)+'px';
    it.el.style.top=(Math.min(210,120)+ (idx%g.rows)*84)+'px';
    it.el.style.display=(pg===PAGE)?'':'none';
  }
  var n=pageCount(),h='';
  for(var j=0;j<n;j++)h+='<i class="'+(j===PAGE?'on':'')+'"></i>';
  $('#dots').innerHTML=h;
}
function goPage(p){var n=pageCount();if(p<0)p=0;if(p>n-1)p=n-1;PAGE=p;layoutIcons();}

function fit(){
  var h=innerH(),w=innerW();
  document.documentElement.style.height=h+'px';document.body.style.height=h+'px';
  $('#desk').style.width=w+'px';$('#wins').style.width=w+'px';$('#wins').style.height=h+'px';
  if(ICONS.length)layoutIcons();
}

/* ── 时钟 ── */
function tick(){
  var d=new Date(),p=function(n){return String(n).padStart(2,'0')};
  var hh=S.h24?d.getHours():(d.getHours()%12||12);
  var t=p(hh)+':'+p(d.getMinutes());
  $('#itime').textContent=t;
  $('#ct').textContent=t;
  $('#cd').textContent=d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日 '+['日','一','二','三','四','五','六'][d.getDay()]+' · 鲸鱼OS';
}

/* ── 通知（岛自己变形）── */
var msgT=null,islandBusy=false;
function dismissIsland(){ $('#island').classList.remove('big'); islandBusy=false; }
function notify(title,body,ms){
  $('#ititle').textContent=title||'鲸鱼OS';$('#ibody').textContent=body||'';
  $('#island').classList.add('big');islandBusy=true;
  clearTimeout(msgT);msgT=setTimeout(dismissIsland,ms||2800);
}
function toast(m){notify('鲸鱼OS',m);}

/* ── 开始菜单 ── */
var menuOpen=false;
function islandTap(){
  if(islandBusy){dismissIsland();return;}
  menuOpen=!menuOpen;
  $('#menu').classList.toggle('open',menuOpen);
  $('#island').classList.toggle('big',false);
}
function closeMenu(){menuOpen=false;$('#menu').classList.remove('open');}

/* ── 应用 ── */
var APPS={
  note:{t:'记事本',ic:'📝',w:330,h:320,body:function(){
    var v='';try{v=localStorage.getItem('whale_note')||''}catch(e){}
    return '<textarea id="noteta" placeholder="随便打点字…（会自动保存）" oninput="saveNote(this.value)">'+v.replace(/</g,'&lt;')+'</textarea>';
  }},
  paint:{t:'画图',ic:'🎨',w:330,h:360,body:function(){
    return '<canvas id="cv" width="290" height="240" style="background:#ffffff12;border-radius:10px;touch-action:none"></canvas>'+
      '<div class="btnrow"><button onclick="paintClear()">清空</button><button onclick="paintSave()">保存到相册</button></div>';
  }},
  trash:{t:'回收站',ic:'🗑️',w:310,h:200,body:function(){
    return '<div>🗑️ 这里空空如也<br><br><small style="opacity:.6">（演示用，不真的删除文件）</small></div>';
  }},
  about:{t:'关于鲸鱼OS',ic:'ℹ️',w:320,h:260,body:function(){
    return '<div><b>鲸鱼OS 2.0</b><br><br>灵动岛（点它开开始菜单）· 分页桌面 · 多任务 · 窗口最小化/最大化 · 设置 · 同步电脑桌面 · 同步手机桌面 · 记事本自动保存 · 画图<br><br>电脑版是 C++ 单文件，网页版一套代码两端复用。</div>';
  }},
  settings:{t:'设置',ic:'⚙️',w:340,h:420,body:function(){
    var ws='';
    for(var i=0;i<6;i++) ws+='<div class="wallsw'+(S.wall===i?' on':'')+'" onclick="setWall('+i+')" style="'+wallBg(i)+'"></div>';
    return '<div class="row"><span class="k">桌面大时钟</span>'+
        '<div class="sw'+(S.clock?' on':'')+'" onclick="tg(\'clock\')"><i></i></div></div>'+
      '<div class="row"><span class="k">灵动岛</span>'+
        '<div class="sw'+(S.island?' on':'')+'" onclick="tg(\'island\')"><i></i></div></div>'+
      '<div class="row"><span class="k">24 小时制</span>'+
        '<div class="sw'+(S.h24?' on':'')+'" onclick="tg(\'h24\')"><i></i></div></div>'+
      '<div style="margin-top:12px"><b>壁纸</b></div><div class="wallgrid">'+ws+'</div>'+
      '<div style="margin-top:6px"><b>同步</b></div>'+
      '<div class="btnrow"><button onclick="appSync()">同步电脑桌面</button><button onclick="phoneDesk()">同步手机桌面</button></div>'+
      '<div style="margin-top:10px"><b>存储</b></div>'+
      '<div class="btnrow"><button onclick="resetAll()">清空本机数据</button><button onclick="openApp(\'taskview\')">多任务</button></div>'+
      '<div style="margin-top:12px;opacity:.55;font-size:11.5px">鲸鱼OS 2.0 · 网页内核 · 设置会自动保存</div>';
  }},
  apps:{t:'所有应用',ic:'🗂️',w:330,h:380,body:function(){
    var l=[['📝','记事本','note'],['🎨','画图','paint'],['🗑️','回收站','trash'],['⚙️','设置','settings'],
           ['ℹ️','关于','about'],['🧮','计算器','calc'],['🪟','多任务','taskview'],['📲','手机桌面','phone'],['🔄','电脑桌面','sync']];
    var h='<div class="btnrow">';
    for(var i=0;i<l.length;i++) h+='<button onclick="openApp(\''+l[i][2]+'\')">'+l[i][0]+' '+l[i][1]+'</button>';
    return h+'</div>';
  }},
  calc:{t:'计算器',ic:'🧮',w:310,h:360,body:function(){
    var ks=['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','=','+','C','←'];
    var h='<div id="cd2" style="font-size:26px;text-align:right;padding:6px;border-bottom:1px solid #ffffff22;margin-bottom:8px">0</div><div class="btnrow">';
    for(var i=0;i<ks.length;i++) h+='<button style="width:58px" onclick="calcKey(\''+ks[i]+'\')">'+ks[i]+'</button>';
    return h+'</div>';
  }},
  sync:{t:'同步电脑桌面',ic:'🔄',w:330,h:340,body:function(){
    return '<div style="font-size:12.5px;line-height:1.6;opacity:.85">把电脑版桌面上的图标搬到这里：</div>'+
      '<div style="margin-top:8px;font-size:12px;opacity:.7">① 电脑版点「生成我的同步码」</div>'+
      '<div style="font-size:12px;opacity:.7">② 手机粘贴 → 点导入</div>'+
      '<textarea id="synccode" placeholder="JLW1-..." style="margin-top:8px;height:86px;border:1px solid #ffffff2e;border-radius:10px;padding:8px;background:#00000033"></textarea>'+
      '<div class="btnrow"><button onclick="applySyncCode(document.getElementById(\'synccode\').value)">导入到桌面</button>'+
      '<button onclick="document.getElementById(\'synccode\').value=syncCode();toast(\'同步码已生成\')">生成我的同步码</button></div>';
  }}
};
function wallBg(i){
  var b=['linear-gradient(180deg,#0b142c,#123152)','linear-gradient(180deg,#141026,#2b1b4d)',
         'linear-gradient(160deg,#07211f,#0b3b36)','linear-gradient(180deg,#2a1030,#4a1a3d)',
         'linear-gradient(160deg,#1b1206,#4a2a0a)','linear-gradient(180deg,#101418,#1c2430)'];
  return 'background:'+b[i];
}

/* ── 设置动作 ── */
function applyS(){
  $('#desk').className=S.wall?'w'+S.wall:'';
  $('#clock').className=S.clock?'':'off';
  $('#island').style.display=S.island?'flex':'none';
  tick();
}
function setWall(i){S.wall=i;saveS();applyS();refreshSettings();toast('壁纸已更换');}
function tg(k){S[k]=!S[k];saveS();applyS();refreshSettings();
  toast({clock:'大时钟：',island:''}[k]||'');}
function refreshSettings(){
  var el=$('#win_settings'); if(!el)return;
  var bd=el.querySelector('.bd'); if(bd)bd.innerHTML=APPS.settings.body();
}
function resetAll(){try{localStorage.removeItem('whaleos2');localStorage.removeItem('whale_note');}catch(e){}
  S={wall:0,clock:true,island:true,h24:true,accent:'#3b82f6'};applyS();refreshSettings();toast('已清空');}

/* ── 窗口 ── */
var wins={},zTop=10;
function openApp(k){
  closeMenu();hideCtx();
  if(k==='taskview')return taskview();
  if(k==='phone')return phoneDesk();
  if(k==='sync')return appSync();
  var a=APPS[k]; if(!a)return;
  if(wins[k]){focusWin(k);return;}
  var W=innerW(),H=innerH(),w=Math.min(a.w,W-24),h=Math.min(a.h,H-150);
  var el=document.createElement('div');
  el.className='win';el.id='win_'+k;
  el.style.width=w+'px';el.style.height=h+'px';
  el.style.left=Math.max(10,(W-w)/2)+'px';el.style.top=Math.max(60,(H-h)/2-30)+'px';
  el.style.zIndex=++zTop;
  el.innerHTML='<div class="tb"><b>'+a.ic+' '+a.t+'</b><div class="btn mn">–</div><div class="btn mx">□</div><div class="btn x">✕</div></div><div class="bd">'+a.body()+'</div>';
  $('#wins').appendChild(el);
  wins[k]={el:el,min:false,max:false};
  el.querySelector('.x').onclick=function(e){e.stopPropagation();closeWin(k);};
  el.querySelector('.mn').onclick=function(e){e.stopPropagation();minWin(k);};
  el.querySelector('.mx').onclick=function(e){e.stopPropagation();maxWin(k);};
  dragWin(k,el.querySelector('.tb'));
  el.addEventListener('mousedown',function(){focusWin(k);});
  el.addEventListener('touchstart',function(){focusWin(k);},{passive:true});
  if(k==='paint')setTimeout(initPaint,60);
  return el;
}
function focusWin(k){var w=wins[k];if(!w)return;if(w.min){w.min=false;w.el.style.display='flex';}w.el.style.zIndex=++zTop;}
function closeWin(k){var w=wins[k];if(!w)return;w.el.parentNode.removeChild(w.el);delete wins[k];}
function minWin(k){var w=wins[k];if(!w)return;w.min=true;w.el.style.display='none';toast('已最小化 · 灵动岛→多任务可恢复');}
function maxWin(k){
  var w=wins[k];if(!w)return;var W=innerW(),H=innerH();
  if(!w.max){w.prev={l:w.el.style.left,t:w.el.style.top,w:w.el.style.width,h:w.el.style.height};
    w.el.style.left='0px';w.el.style.top='44px';w.el.style.width=W+'px';w.el.style.height=(H-44)+'px';
    w.el.classList.add('max');w.max=true;}
  else{w.el.style.left=w.prev.l;w.el.style.top=w.prev.t;w.el.style.width=w.prev.w;w.el.style.height=w.prev.h;
    w.el.classList.remove('max');w.max=false;}
  fit();
}
function dragWin(k,tb){
  var w=wins[k],sx=0,sy=0,ol=0,ot=0,on=false;
  function down(e){if(w.max)return;on=true;var p=e.touches?e.touches[0]:e;
    sx=p.clientX;sy=p.clientY;ol=parseInt(w.el.style.left)||0;ot=parseInt(w.el.style.top)||0;
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
    document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up);}
  function mv(e){if(!on)return;var p=e.touches?e.touches[0]:e;if(!p)return;
    var nx=Math.max(-40,Math.min(innerW()-70,ol+(p.clientX-sx)));
    var ny=Math.max(46,Math.min(innerH()-60,ot+(p.clientY-sy)));
    w.el.style.left=nx+'px';w.el.style.top=ny+'px';
    if(e.cancelable&&e.touches)e.preventDefault();}
  function up(){on=false;document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up);}
  tb.addEventListener('mousedown',down);tb.addEventListener('touchstart',down,{passive:false});
}

/* ── 多任务 ── */
function taskview(){
  closeMenu();
  var list=$('#tvlist'),ks=Object.keys(wins),h='';
  h='<div class="hdr"><span class="t">🪟 后台 · '+ks.length+' 个应用</span>'+
    (ks.length?'<span class="a" onclick="tvCloseAll()">全部关闭</span>':'')+'</div><div class="grid">';
  if(!ks.length){
    h+='<div class="empty">后台是空的<br><br>点灵动岛 → 开始，打开几个应用<br>它们会一直留在后台</div>';
  } else {
    for(var i=0;i<ks.length;i++){
      var k=ks[i],a=APPS[k]||{ic:'🪟',t:k},w=wins[k];
      h+='<div class="card">'+
         (w.min?'<span class="tag">已最小化</span>':'<span class="tag">运行中</span>')+
         '<div class="pv" onclick="tvOpen(\''+k+'\')">'+a.ic+'</div>'+
         '<div class="bar" onclick="tvOpen(\''+k+'\')"><span class="n">'+a.t+'</span>'+
         '<span class="x" onclick="event.stopPropagation();tvClose(\''+k+'\')">✕</span></div></div>';
    }
  }
  h+='</div><div style="text-align:center;margin-top:8px"><button onclick="tvHide()" style="padding:10px 24px;border-radius:12px;border:1px solid #ffffff2e;background:#ffffff14;color:#e8f1ff">返回桌面</button></div>';
  list.innerHTML=h;$('#tv').classList.add('show');
}
function tvCloseAll(){
  var n=Object.keys(wins).length;
  for(var k in wins){ if(wins[k].el.parentNode) wins[k].el.parentNode.removeChild(wins[k].el); }
  wins={}; taskview(); notify('后台','已关闭 '+n+' 个应用',2000);
}
function tvHide(){$('#tv').classList.remove('show');}
function tvOpen(k){tvHide();focusWin(k);}
function tvClose(k){closeWin(k);taskview();}

/* ── 记事本 / 画图 ── */
function saveNote(v){try{localStorage.setItem('whale_note',v);}catch(e){}}
var cvCtx=null,drawing=false;
function initPaint(){
  var cv=$('#cv');if(!cv)return;cvCtx=cv.getContext('2d');
  cvCtx.strokeStyle='#7cc4ff';cvCtx.lineWidth=4;cvCtx.lineCap='round';
  function pos(e){var r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;
    return {x:p.clientX-r.left,y:p.clientY-r.top};}
  cv.onmousedown=function(e){drawing=true;var p=pos(e);cvCtx.beginPath();cvCtx.moveTo(p.x,p.y);};
  cv.onmousemove=function(e){if(!drawing)return;var p=pos(e);cvCtx.lineTo(p.x,p.y);cvCtx.stroke();};
  cv.onmouseup=function(){drawing=false;};
  cv.ontouchstart=function(e){drawing=true;var p=pos(e);cvCtx.beginPath();cvCtx.moveTo(p.x,p.y);e.preventDefault();};
  cv.ontouchmove=function(e){if(!drawing)return;var p=pos(e);cvCtx.lineTo(p.x,p.y);cvCtx.stroke();e.preventDefault();};
  cv.ontouchend=function(){drawing=false;};
}
function paintClear(){var cv=$('#cv');if(cv&&cvCtx)cvCtx.clearRect(0,0,cv.width,cv.height);}
function paintSave(){
  var cv=$('#cv');if(!cv)return;
  try{
    if(window.AndroidOS&&AndroidOS.saveImage){AndroidOS.saveImage(cv.toDataURL('image/png'));toast('已保存到相册');}
    else{var a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='whaleos-paint.png';a.click();toast('已下载图片');}
  }catch(e){toast('保存失败');}
}

/* ── 计算器 ── */
var cb='0';
function calcKey(k){
  var d=$('#cd2');if(!d)return;
  if(k==='C')cb='0';
  else if(k==='←')cb=cb.length>1?cb.slice(0,-1):'0';
  else if(k==='='){
    try{var ex=cb.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      if(!/^[0-9+\-*/.() ]+$/.test(ex))throw 0;
      cb=String(Math.round(Function('return ('+ex+')')()*1e10)/1e10);}
    catch(e){cb='错误';}
  } else cb=(cb==='0'||cb==='错误')?k:cb+k;
  d.textContent=cb;
}

/* ── 同步：电脑桌面 / 手机桌面 ── */
function deskIcons(){
  var arr=[];
  for(var i=0;i<ICONS.length;i++) arr.push({n:ICONS[i].name, a:ICONS[i].app});
  return arr;
}
function syncCode(){
  try{return 'JLW1-'+btoa(unescape(encodeURIComponent(JSON.stringify(deskIcons())))).slice(0,200);}
  catch(e){return 'JLW1-ERR';}
}
function applySyncCode(code){
  code=(code||'').trim().replace(/^JLW1-/,'');
  if(!code){toast('同步码是空的');return;}
  try{
    var arr=JSON.parse(decodeURIComponent(escape(atob(code))));
    if(!arr||!arr.length)throw 0;
    for(var i=0;i<arr.length;i++){
      var d=document.createElement('div');
      d.className='icon';
      d.setAttribute('onclick',"openApp('"+(arr[i].a||'note')+"')");
      d.innerHTML='<div class="g">📦</div>'+arr[i].n;
      $('#desk').appendChild(d);
      ICONS.push({el:d,app:arr[i].a||'note',name:arr[i].n});
    }
    layoutIcons();toast('同步完成：'+arr.length+' 个图标');
  }catch(e){toast('同步码无效');}
}
function appSync(){openApp('sync');}
function phoneDesk(){
  if(!window.AndroidOS||!window.AndroidOS.listApps){
    notify('同步手机桌面','网页版读不到手机应用，装 APK 才有',3200);return;}
  notify('同步手机桌面','正在读取已安装的应用…',1500);
  setTimeout(function(){
    var arr=[];try{arr=JSON.parse(AndroidOS.listApps());}catch(e){notify('同步失败','读不到应用列表',2600);return;}
    var old=document.querySelectorAll('.icon.phoneicon');
    for(var i=0;i<old.length;i++){old[i].parentNode.removeChild(old[i]);}
    collectIcons();
    for(var j=0;j<arr.length;j++){
      var a=arr[j],d=document.createElement('div');
      d.className='icon phoneicon';
      d.innerHTML='<div class="g" style="background:#ffffff22">'+(a.i?'<img src="'+a.i+'">':'📦')+'</div>'+a.n;
      (function(pkg){d.onclick=function(){try{AndroidOS.launch(pkg);}catch(e){}};})(a.p);
      $('#desk').appendChild(d);
      ICONS.push({el:d,app:'android',name:String(a.n)});
    }
    layoutIcons();
    notify('同步完成','手机上 '+arr.length+' 个应用已摆到第 2 页',2600);
    goPage(1);
  },260);
}

/* ── 手势 ── */
function gestures(){
  var sx=0,sy=0,t0=0,edge=false;
  document.addEventListener('touchstart',function(e){
    var p=e.touches[0];if(!p)return;
    sx=p.clientX;sy=p.clientY;t0=Date.now();edge=(sx<26);
  },{passive:true});
  document.addEventListener('touchend',function(e){
    var p=(e.changedTouches&&e.changedTouches[0]);if(!p)return;
    var dx=p.clientX-sx,dy=p.clientY-sy;
    if(edge&&dx>70&&Math.abs(dy)<70){window.onBackPressed();return;}
    if(!e.target.closest('.win')&&!e.target.closest('#island')&&!e.target.closest('#menu')
       &&Math.abs(dx)>55&&Math.abs(dy)<70&&Date.now()-t0<900){
      goPage(PAGE+(dx<0?1:-1));
    }
  },{passive:true});
  var lt=null,isl=$('#island');
  isl.addEventListener('touchstart',function(){lt=setTimeout(function(){taskview();lt=null;},650);},{passive:true});
  isl.addEventListener('touchend',function(){if(lt){clearTimeout(lt);lt=null;}},{passive:true});
  isl.addEventListener('touchmove',function(){if(lt){clearTimeout(lt);lt=null;}},{passive:true});
}

/* ── 桌面长按 / 右键菜单 ── */
var ctxT=null;
function showCtx(x,y){var c=$('#ctx');c.classList.add('show');
  c.style.left=Math.min(x,innerW()-180)+'px';c.style.top=Math.min(y,innerH()-160)+'px';}
function hideCtx(){$('#ctx').classList.remove('show');}
function ctxNew(){
  hideCtx();
  var d=document.createElement('div');d.className='icon';
  d.setAttribute('onclick',"openApp('note')");
  d.innerHTML='<div class="g">📄</div>新建文档';
  $('#desk').appendChild(d);ICONS.push({el:d,app:'note',name:'新建文档'});
  layoutIcons();toast('已新建文本文档');
}
function ctxWall(){hideCtx();setWall((S.wall+1)%6);}
function ctxClean(){hideCtx();goPage(0);toast('桌面已整理');}

/* ── 返回键 ── */
var lastBack=0;
window.onBackPressed=function(){
  var now=Date.now(),dbl=(now-lastBack)<700;lastBack=now;
  if($('#tv').classList.contains('show')){tvHide();return true;}
  if(menuOpen){closeMenu();return true;}
  if(islandBusy){dismissIsland();return true;}
  if($('#ctx').classList.contains('show')){hideCtx();return true;}
  if(dbl){if(!menuOpen){menuOpen=true;$('#menu').classList.add('open');}return true;}
  var top=null,tz=-1;
  for(var k in wins){var w=wins[k];if(w.min)continue;var z=parseInt(w.el.style.zIndex)||0;if(z>tz){tz=z;top=k;}}
  if(top){minWin(top);return true;}
  toast('已在桌面 · 连按两下回开始菜单');
  return true;
};

/* ── 事件绑定 ── */
document.addEventListener('click',function(e){
  if(!e.target.closest('#menu')&&!e.target.closest('#island'))closeMenu();
  if(!e.target.closest('#ctx'))hideCtx();
});
document.addEventListener('contextmenu',function(e){
  if(e.target.closest('#desk')&&!e.target.closest('.icon')&&!e.target.closest('.win')){
    e.preventDefault();showCtx(e.clientX,e.clientY);
  }
});
document.addEventListener('touchstart',function(e){
  if(e.target.closest('.icon')||e.target.closest('.win')||e.target.closest('#island'))return;
  var p=e.touches[0];if(!p)return;
  var x=p.clientX,y=p.clientY;
  ctxT=setTimeout(function(){
    var el=document.elementFromPoint(x,y);
    if(el&&!el.closest('.icon')&&!el.closest('.win'))showCtx(x,y);
  },600);
},{passive:true});
document.addEventListener('touchend',function(){if(ctxT){clearTimeout(ctxT);ctxT=null;}},{passive:true});
document.addEventListener('touchmove',function(){if(ctxT){clearTimeout(ctxT);ctxT=null;}},{passive:true});

/* ── 启动 ── */
fit();collectIcons();layoutIcons();gestures();applyS();
setInterval(tick,1000);tick();
window.addEventListener('resize',function(){setTimeout(function(){fit();},120);});
window.addEventListener('orientationchange',function(){setTimeout(function(){fit();},300);});
setTimeout(function(){toast('鲸鱼OS 2.0 · 点灵动岛开始');},700);
</script>
