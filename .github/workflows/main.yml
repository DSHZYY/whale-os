name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: compile
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /utf-8 /DUNICODE /D_UNICODE OS.cpp /link user32.lib gdiplus.lib gdi32.lib shell32.lib shlwapi.lib > build.log 2>&1
          type build.log
          exit /b 0
      - name: 把编译日志提交回仓库
        if: always()
        shell: bash
        run: |
          git config user.name ci-bot
          git config user.email ci@example.com
          git add build.log 2>/dev/null || true
          git commit -m "build log [skip ci]" 2>/dev/null || true
          git push 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 鲸鱼OS-exe
          path: |
            OS.exe
            build.log

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: 生成安卓工程
        run: |
          mkdir -p android/app/src/main/java/os/whale android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "whaleos"
          include ":app"
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'os.whale'
              compileSdk 34
              defaultConfig {
                  applicationId "os.whale"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "2.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="鲸鱼OS" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true"
                            android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode|density|fontScale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/os/whale/MainActivity.java <<'EOF'
          package os.whale;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import java.io.ByteArrayOutputStream;
          import java.util.List;

          public class MainActivity extends Activity {
              private WebView web;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setTextZoom(100);
                  web.setBackgroundColor(0xFF0B142C);
                  web.addJavascriptInterface(new Bridge(), "AndroidOS");
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }

              public class Bridge {
                  @JavascriptInterface public String ver() { return "whaleos2-android"; }

                  @JavascriptInterface public String listApps() {
                      StringBuilder sb = new StringBuilder("[");
                      int n = 0;
                      try {
                          PackageManager pm = getPackageManager();
                          Intent main = new Intent(Intent.ACTION_MAIN, null);
                          main.addCategory(Intent.CATEGORY_LAUNCHER);
                          List<ResolveInfo> apps = pm.queryIntentActivities(main, 0);
                          for (ResolveInfo ri : apps) {
                              if (n >= 40) break;
                              String pkg = ri.activityInfo.packageName;
                              if (pkg.equals(getPackageName())) continue;
                              String label = String.valueOf(ri.loadLabel(pm));
                              String icon = "";
                              try {
                                  Drawable d = ri.loadIcon(pm);
                                  int sz = 96;
                                  Bitmap bmp = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888);
                                  Canvas c = new Canvas(bmp);
                                  d.setBounds(0, 0, sz, sz);
                                  d.draw(c);
                                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                                  bmp.compress(Bitmap.CompressFormat.PNG, 80, bo);
                                  icon = "data:image/png;base64," + Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
                              } catch (Throwable t) { }
                              if (n > 0) sb.append(",");
                              sb.append("{\"n\":\"").append(esc(label)).append("\",\"p\":\"").append(pkg)
                                .append("\",\"i\":\"").append(icon).append("\"}");
                              n++;
                          }
                      } catch (Throwable t) { }
                      return sb.append("]").toString();
                  }

                  @JavascriptInterface public void launch(String pkg) {
                      try {
                          Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (i != null) startActivity(i);
                      } catch (Throwable t) { }
                  }

                  private String esc(String s) {
                      return s.replace("\\", "\\\\").replace("\"", "\\\"");
                  }
              }

              @Override public void onBackPressed() {
                  if (web == null) { super.onBackPressed(); return; }
                  web.evaluateJavascript("(window.onBackPressed?window.onBackPressed():false)", value -> {
                      if (value == null || !value.contains("true")) {
                          runOnUiThread(() -> finish());
                      }
                  });
              }

              @Override public void onWindowFocusChanged(boolean has) {
                  super.onWindowFocusChanged(has);
                  if (has) getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                        | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
              }
          }
          EOF
      - name: 编译 APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --no-daemon --stacktrace > ../apk.log 2>&1 || (cat ../apk.log; exit 1)
      - name: 把 APK 日志提交回仓库
        if: always()
        shell: bash
        run: |
          git config user.name ci-bot
          git config user.email ci@example.com
          git add apk.log 2>/dev/null || true
          git commit -m "apk log [skip ci]" 2>/dev/null || true
          git push 2>/dev/null || true
      - name: show apk log
        if: always()
        shell: bash
        run: cat apk.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 鲸鱼OS-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
